<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>MX10 · Печать фото</title>
<style>
  :root{
    --paper:#e8e4d9;
    --ink:#17140f;
    --ink-soft:#5a5548;
    --accent:#b3261e;
    --accent-soft:#b3261e22;
    --line:rgba(23,20,15,.18);
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at top, #2a271f 0%, #17150f 70%);
    min-height:100vh;
    font-family: var(--sans);
    color: var(--ink);
    display:flex;
    justify-content:center;
    padding: 28px 14px 60px;
  }
  .receipt{ width:100%; max-width:420px; }
  .card{
    background: var(--paper);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.6), 0 2px 0 rgba(0,0,0,.2) inset;
    padding: 26px 22px 30px;
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute; top:-9px; left:0; right:0; height:10px;
    background: linear-gradient(135deg, var(--paper) 50%, transparent 50%),
                linear-gradient(-135deg, var(--paper) 50%, transparent 50%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 0;
    background-repeat: repeat-x;
  }
  header{ text-align:center; margin-bottom: 18px; }
  .brand{ font-family: var(--mono); letter-spacing: .18em; text-transform: uppercase; font-size: 11px; color: var(--ink-soft); }
  h1{ font-family: var(--mono); font-size: 26px; margin: 6px 0 2px; letter-spacing: -0.01em; }
  .sub{ font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
  .rule{ border: none; border-top: 1.5px dashed var(--line); margin: 18px 0; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin: 10px 0;}
  .status{ display:flex; align-items:center; gap:8px; font-family: var(--mono); font-size: 13px; }
  .dot{ width:8px; height:8px; border-radius:50%; background: #9a927e; flex-shrink:0; }
  .dot.on{ background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  button{
    font-family: var(--sans); font-weight: 600; font-size: 14px;
    border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
    padding: 10px 16px; cursor: pointer; letter-spacing: .01em;
  }
  button:active{ transform: translateY(1px); }
  button:disabled{ opacity:.35; cursor:not-allowed; }
  button.primary{
    background: var(--accent); border-color: var(--accent); color: #fbf3ea;
    width: 100%; padding: 14px 16px; font-size: 15px;
  }
  button.stop{
    background: transparent; border-color: var(--accent); color: var(--accent);
    width: 100%; padding: 14px 16px; font-size: 15px;
  }
  button.ghost{ border-color: var(--line); }
  button.wide{ width:100%; }
  .field{ margin: 14px 0; }
  label{
    display:flex; justify-content:space-between; font-family: var(--mono); font-size: 11px;
    text-transform:uppercase; letter-spacing:.1em; color: var(--ink-soft); margin-bottom: 6px;
  }
  label span.val{ color: var(--accent); font-weight:600; }
  input[type=range]{ width:100%; accent-color: var(--accent); }
  .hint-row{
    display:flex; justify-content:space-between; font-family: var(--mono);
    font-size: 10px; color: var(--ink-soft); margin-top:4px;
    text-transform:uppercase; letter-spacing:.05em;
  }
  select{
    width:100%; font-family: var(--sans); font-size:14px;
    padding: 8px; border:1.5px solid var(--line); background:#fbf9f4;
  }
  .dropzone{
    border: 1.5px dashed var(--line); padding: 22px 14px; text-align:center;
    font-family: var(--mono); font-size: 13px; color: var(--ink-soft); cursor:pointer;
  }
  .dropzone.has-img{ border-style: solid; }
  input[type=file]{ display:none; }
  .preview-wrap{ margin: 18px auto 0; max-width: 220px; filter: drop-shadow(0 14px 18px rgba(0,0,0,.35)); }
  canvas#preview{ width:100%; display:block; background:#fff; image-rendering: pixelated; }
  .tear{
    width:100%; height:12px;
    background: linear-gradient(135deg, #fff 50%, transparent 50%), linear-gradient(-135deg, #fff 50%, transparent 50%);
    background-size: 14px 14px; background-position: 0 0, 7px 0; background-repeat: repeat-x;
  }
  .log{ font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); white-space: pre-wrap; min-height: 16px; margin-top: 10px; line-height:1.5; }
  .progress{ height: 4px; background: var(--line); margin-top: 8px; overflow:hidden; }
  .progress > i{ display:block; height:100%; width:0%; background: var(--accent); transition: width .15s; }
  .banner{
    font-family: var(--mono); font-size: 12px; background:#3a2320; color:#f3d9d4;
    padding: 10px 12px; margin-bottom:14px; border:1px solid #6b3530;
  }
  footer{ text-align:center; margin-top: 16px; font-family: var(--mono); font-size: 10px; color:#7a7360; }
  .adv{ font-family: var(--mono); font-size: 11px; color: var(--ink-soft); cursor:pointer; text-align:center; margin-top:10px; text-decoration: underline dotted; }
  .adv-panel{ display:none; }
  .adv-panel.open{ display:block; }
</style>
</head>
<body>
<div class="receipt">
  <div class="card">
    <header>
      <div class="brand">bt instant printing</div>
      <h1>MX10</h1>
      <div class="sub">фото → термолента</div>
    </header>

    <div id="unsupported" class="banner" style="display:none"></div>

    <div class="row">
      <div class="status"><span id="dot" class="dot"></span><span id="statusText">не подключено</span></div>
      <button id="connectBtn" class="ghost">Подключить</button>
    </div>

    <hr class="rule">

    <div id="dropzone" class="dropzone">выберите фото или перетащите сюда</div>
    <input type="file" id="fileInput" accept="image/*">

    <div class="preview-wrap" id="previewWrap" style="display:none">
      <canvas id="preview"></canvas>
      <div class="tear"></div>
    </div>

    <button id="rotateBtn" class="ghost wide" style="margin-top:14px;">⟳ повернуть на 90°</button>

    <div class="field">
      <label>размер печати</label>
      <input type="range" id="sizeSlider" min="30" max="100" value="100">
      <div class="hint-row"><span>меньше</span><span>во всю ширину</span></div>
    </div>

    <div class="field">
      <label>растянуть по высоте</label>
      <input type="range" id="stretchSlider" min="50" max="200" value="100">
      <div class="hint-row"><span>сжать</span><span>вытянуть</span></div>
    </div>

    <div class="field">
      <label>сила нагрева (затемнение) <span class="val" id="darknessVal">55%</span></label>
      <input type="range" id="darkness" min="0" max="100" value="55">
    </div>

    <div class="field">
      <label>скорость выхода ленты <span class="val" id="durationEst">≈ 0 сек</span></label>
      <input type="range" id="speedSlider" min="0" max="100" value="50">
      <div class="hint-row"><span>медленнее / чётче</span><span>быстрее</span></div>
    </div>

    <div class="adv" id="advToggle">настройки принтера ▾</div>
    <div class="adv-panel" id="advPanel">
      <div class="field">
        <label>дизеринг</label>
        <select id="ditherMode">
          <option value="fs">Floyd–Steinberg (плавные тона)</option>
          <option value="threshold">Порог (чёткий чёрно-белый)</option>
        </select>
      </div>
      <div class="field">
        <label>ширина ленты</label>
        <select id="paperWidth">
          <option value="384" selected>58 мм / 384 точки (по умолчанию)</option>
          <option value="576">80 мм / 576 точек</option>
        </select>
      </div>
      <div class="field">
        <label>пауза между пакетами (BLE)</label>
        <input type="range" id="delaySlider" min="0" max="100" value="20">
        <div class="hint-row"><span>быстрее</span><span>стабильнее</span></div>
      </div>
    </div>

    <hr class="rule">

    <div class="row">
      <div class="status" style="font-family:var(--mono); font-size:12px; color:var(--ink-soft);">лента</div>
      <button id="feedBtn" class="ghost" disabled>протянуть / обрезать →</button>
    </div>

    <hr class="rule">

    <button id="printBtn" class="primary" disabled>Печать</button>
    <button id="stopBtn" class="stop" style="display:none;">Стоп</button>
    <div class="progress"><i id="progressBar"></i></div>
    <div class="log" id="log"></div>
  </div>
  <footer>протокол cat-printer (GPL-3.0) · для MX10 и совместимых мини-принтеров</footer>
</div>

<script>
(function(){
  'use strict';

  // ---------- BLE protocol constants (cat-printer family, MX10-compatible) ----------
  const SERVICE_UUID = '0000ae30-0000-1000-8000-00805f9b34fb';
  const WRITE_UUID    = '0000ae01-0000-1000-8000-00805f9b34fb';
  const NOTIFY_UUID   = '0000ae02-0000-1000-8000-00805f9b34fb';

  const PAUSE_SIGNAL  = [0x51,0x78,0xae,0x01,0x01,0x00,0x10,0x70,0xff];
  const RESUME_SIGNAL = [0x51,0x78,0xae,0x01,0x01,0x00,0x00,0x00,0xff];

  const CRC8_TABLE = [
    0x00,0x07,0x0e,0x09,0x1c,0x1b,0x12,0x15,0x38,0x3f,0x36,0x31,0x24,0x23,0x2a,0x2d,
    0x70,0x77,0x7e,0x79,0x6c,0x6b,0x62,0x65,0x48,0x4f,0x46,0x41,0x54,0x53,0x5a,0x5d,
    0xe0,0xe7,0xee,0xe9,0xfc,0xfb,0xf2,0xf5,0xd8,0xdf,0xd6,0xd1,0xc4,0xc3,0xca,0xcd,
    0x90,0x97,0x9e,0x99,0x8c,0x8b,0x82,0x85,0xa8,0xaf,0xa6,0xa1,0xb4,0xb3,0xba,0xbd,
    0xc7,0xc0,0xc9,0xce,0xdb,0xdc,0xd5,0xd2,0xff,0xf8,0xf1,0xf6,0xe3,0xe4,0xed,0xea,
    0xb7,0xb0,0xb9,0xbe,0xab,0xac,0xa5,0xa2,0x8f,0x88,0x81,0x86,0x93,0x94,0x9d,0x9a,
    0x27,0x20,0x29,0x2e,0x3b,0x3c,0x35,0x32,0x1f,0x18,0x11,0x16,0x03,0x04,0x0d,0x0a,
    0x57,0x50,0x59,0x5e,0x4b,0x4c,0x45,0x42,0x6f,0x68,0x61,0x66,0x73,0x74,0x7d,0x7a,
    0x89,0x8e,0x87,0x80,0x95,0x92,0x9b,0x9c,0xb1,0xb6,0xbf,0xb8,0xad,0xaa,0xa3,0xa4,
    0xf9,0xfe,0xf7,0xf0,0xe5,0xe2,0xeb,0xec,0xc1,0xc6,0xcf,0xc8,0xdd,0xda,0xd3,0xd4,
    0x69,0x6e,0x67,0x60,0x75,0x72,0x7b,0x7c,0x51,0x56,0x5f,0x58,0x4d,0x4a,0x43,0x44,
    0x19,0x1e,0x17,0x10,0x05,0x02,0x0b,0x0c,0x21,0x26,0x2f,0x28,0x3d,0x3a,0x33,0x34,
    0x4e,0x49,0x40,0x47,0x52,0x55,0x5c,0x5b,0x76,0x71,0x78,0x7f,0x6a,0x6d,0x64,0x63,
    0x3e,0x39,0x30,0x37,0x22,0x25,0x2c,0x2b,0x06,0x01,0x08,0x0f,0x1a,0x1d,0x14,0x13,
    0xae,0xa9,0xa0,0xa7,0xb2,0xb5,0xbc,0xbb,0x96,0x91,0x98,0x9f,0x8a,0x8d,0x84,0x83,
    0xde,0xd9,0xd0,0xd7,0xc2,0xc5,0xcc,0xcb,0xe6,0xe1,0xe8,0xef,0xfa,0xfd,0xf4,0xf3
  ];
  function crc8(bytes){
    let crc = 0;
    for (const b of bytes) crc = CRC8_TABLE[(crc ^ b) & 0xff];
    return crc & 0xff;
  }
  function reverseBits(i){
    i = ((i & 0b10101010) >> 1) | ((i & 0b01010101) << 1);
    i = ((i & 0b11001100) >> 2) | ((i & 0b00110011) << 2);
    return ((i & 0b11110000) >> 4) | ((i & 0b00001111) << 4);
  }
  function clampInt(n, min, max, fallback){
    n = parseInt(n, 10);
    if (!Number.isFinite(n)) n = fallback;
    return Math.max(min, Math.min(max, n));
  }
  function u16le(n){ n = clampInt(n, 0, 0xffff, 0); return [n & 0xff, (n >> 8) & 0xff]; }

  function makeCommand(commandBit, payload){
    if (payload.length > 0xff) throw new Error('payload too big');
    return [0x51,0x78,commandBit,0x00,payload.length,0x00, ...payload, crc8(payload), 0xff];
  }

  // Narrow band centred on 32 — that exact value is confirmed working on this unit;
  // wider swings previously produced blank prints, so we stay close to it.
  function speedByteFromSlider(s){ return clampInt(Math.round(24 + s*0.16), 24, 40, 32); }
  function delayMsFromSlider(t){ return Math.round(5 + t * 0.75); }

  // ---------- Builds the full print job as one flat byte stream ----------
  class PrintJob {
    constructor({ energy, speed=32 }){ this.energy = energy; this.speed = speed; this.bytes = []; }
    push(arr){ this.bytes.push(...arr); }
    startPrintingNew(){ this.push([0x12,0x51,0x78,0xa3,0x00,0x01,0x00,0x00,0x00,0xff]); }
    getDeviceState(){ this.push(makeCommand(0xa3,[0x00])); }
    updateDevice(){ this.push(makeCommand(0xa9,[0x00])); }
    setDpiAs200(){ this.push(makeCommand(0xa4,[50])); }
    setSpeed(v){ this.push(makeCommand(0xbd,[clampInt(v,1,63,32)])); }
    setEnergy(a){ this.push(makeCommand(0xaf, u16le(a))); }
    applyEnergy(){ this.push(makeCommand(0xbe,[0x01])); }
    startLattice(){ this.push(makeCommand(0xa6,[0xaa,0x55,0x17,0x38,0x44,0x5f,0x5f,0x5f,0x44,0x38,0x2c])); }
    endLattice(){ this.push(makeCommand(0xa6,[0xaa,0x55,0x17,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x17])); }
    feedPaper(px){ this.push(makeCommand(0xa1, u16le(px))); }
    drawBitmapRow(rowBytes){ this.push(makeCommand(0xa2, Array.from(rowBytes, reverseBits))); }
    build(bitmapRows){
      this.getDeviceState();
      this.startPrintingNew();
      this.setDpiAs200();
      this.setSpeed(this.speed);
      this.setEnergy(this.energy);
      this.applyEnergy();
      this.updateDevice();
      this.startLattice();
      for (const row of bitmapRows) this.drawBitmapRow(row);
      this.endLattice();
      this.setSpeed(8);
      this.feedPaper(128);
      this.getDeviceState();
      return new Uint8Array(this.bytes);
    }
  }

  // ---------- Image -> 1-bit bitmap rows (MSB-first, 1 = black) ----------
  function imageToBitmapRows(canvas, ditherMode){
    const w = canvas.width, h = canvas.height;
    const ctx = canvas.getContext('2d');
    const imgData = ctx.getImageData(0,0,w,h);
    const gray = new Float32Array(w*h);
    for (let i=0, p=0; i<imgData.data.length; i+=4, p++){
      gray[p] = 0.299*imgData.data[i] + 0.587*imgData.data[i+1] + 0.114*imgData.data[i+2];
    }
    const bytesPerRow = w/8;
    const rows = [];
    for (let y=0; y<h; y++){
      const rowBytes = new Uint8Array(bytesPerRow);
      for (let x=0; x<w; x++){
        const idx = y*w+x;
        const old = gray[idx];
        const black = old < 128 ? 1 : 0;
        if (ditherMode === 'fs'){
          const newVal = black ? 0 : 255;
          const err = old - newVal;
          if (x+1<w) gray[idx+1] += err*7/16;
          if (y+1<h){
            if (x>0) gray[idx-1+w] += err*3/16;
            gray[idx+w] += err*5/16;
            if (x+1<w) gray[idx+1+w] += err*1/16;
          }
        }
        if (black) rowBytes[x >> 3] |= (0x80 >> (x & 7));
      }
      rows.push(rowBytes);
    }
    return rows;
  }

  // ---------- UI wiring ----------
  const $ = (id) => document.getElementById(id);
  const log = (msg) => { $('log').textContent = msg; };

  let writeChar=null, notifyChar=null, paused=false, sourceImage=null, rotation=0, printAbort=false;

  if (!navigator.bluetooth){
    $('unsupported').style.display = 'block';
    $('unsupported').textContent = 'Web Bluetooth недоступен в этом браузере. Откройте страницу в Chrome для Android.';
    $('connectBtn').disabled = true;
  } else if (location.protocol !== 'https:' && location.hostname !== 'localhost'){
    $('unsupported').style.display = 'block';
    $('unsupported').textContent = 'Откройте страницу по https:// — Bluetooth не работает при открытии файла напрямую.';
  }

  $('connectBtn').addEventListener('click', async () => {
    try{
      log('выбор устройства…');
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });
      device.addEventListener('gattserverdisconnected', onDisconnected);
      log('подключение…');
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      writeChar = await service.getCharacteristic(WRITE_UUID);
      notifyChar = await service.getCharacteristic(NOTIFY_UUID);
      await notifyChar.startNotifications();
      notifyChar.addEventListener('characteristicvaluechanged', onNotify);
      $('dot').classList.add('on');
      $('statusText').textContent = device.name || 'подключено';
      log('готово к печати');
      updateButtons();
    } catch(e){
      log('ошибка подключения: ' + e.message);
    }
  });

  function onDisconnected(){
    $('dot').classList.remove('on');
    $('statusText').textContent = 'отключено';
    writeChar = null; notifyChar = null;
    updateButtons();
  }
  function onNotify(ev){
    const arr = Array.from(new Uint8Array(ev.target.value.buffer));
    if (arraysEqual(arr, PAUSE_SIGNAL)) paused = true;
    else if (arraysEqual(arr, RESUME_SIGNAL)) paused = false;
  }
  function arraysEqual(a,b){
    if (a.length!==b.length) return false;
    for (let i=0;i<a.length;i++) if(a[i]!==b[i]) return false;
    return true;
  }

  $('dropzone').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', (e) => { if (e.target.files[0]) loadImage(e.target.files[0]); });
  $('dropzone').addEventListener('dragover', e=>e.preventDefault());
  $('dropzone').addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]); });

  function loadImage(file){
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => { sourceImage = img; rotation = 0; renderPreview(); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  $('rotateBtn').addEventListener('click', () => {
    if (!sourceImage) return;
    rotation = (rotation + 90) % 360;
    renderPreview();
  });

  function getRotatedSource(){
    if (rotation === 0) return sourceImage;
    const swap = (rotation === 90 || rotation === 270);
    const rw = swap ? sourceImage.height : sourceImage.width;
    const rh = swap ? sourceImage.width : sourceImage.height;
    const off = document.createElement('canvas');
    off.width = rw; off.height = rh;
    const octx = off.getContext('2d');
    octx.translate(rw/2, rh/2);
    octx.rotate(rotation*Math.PI/180);
    octx.drawImage(sourceImage, -sourceImage.width/2, -sourceImage.height/2);
    return off;
  }

  function renderPreview(){
    if (!sourceImage) return;
    try{
      const paperWidth = clampInt($('paperWidth').value, 384, 576, 384);
      const sizePct = clampInt($('sizeSlider').value, 30, 100, 100);
      const stretchPct = clampInt($('stretchSlider').value, 50, 200, 100);
      const src = getRotatedSource();

      const drawWidth = Math.max(8, Math.round(paperWidth * sizePct/100));
      const baseScale = drawWidth / src.width;
      const baseHeight = Math.max(1, Math.round(src.height * baseScale));
      const drawHeight = Math.max(1, Math.round(baseHeight * stretchPct/100));
      const offsetX = Math.round((paperWidth - drawWidth)/2);

      const canvas = $('preview');
      canvas.width = paperWidth;
      canvas.height = drawHeight;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,paperWidth,drawHeight);
      ctx.drawImage(src, offsetX, 0, drawWidth, drawHeight);

      const rows = imageToBitmapRows(canvas, $('ditherMode').value);
      const out = ctx.createImageData(paperWidth, drawHeight);
      for (let y=0;y<drawHeight;y++){
        for (let x=0;x<paperWidth;x++){
          const bit = (rows[y][x>>3] >> (7-(x&7))) & 1;
          const val = bit ? 0 : 255;
          const idx = (y*paperWidth+x)*4;
          out.data[idx]=out.data[idx+1]=out.data[idx+2]=val;
          out.data[idx+3]=255;
        }
      }
      ctx.putImageData(out,0,0);

      $('previewWrap').style.display = 'block';
      $('dropzone').classList.add('has-img');
      $('dropzone').textContent = 'заменить фото';
      $('printBtn')._rows = rows;
      updateButtons();
      updateDurationEstimate();
    } catch(e){
      log('ошибка обработки фото: ' + e.message);
    }
  }

  ['input','change'].forEach(evt=>{
    $('sizeSlider').addEventListener(evt, renderPreview);
    $('stretchSlider').addEventListener(evt, renderPreview);
    $('ditherMode').addEventListener(evt, renderPreview);
    $('paperWidth').addEventListener(evt, renderPreview);
  });

  // heat/darkness only affects the print job (energy sent to the printer) — it does NOT
  // re-run the dithering pipeline, so touching it can never corrupt the already-rendered bitmap.
  $('darkness').addEventListener('input', () => {
    $('darknessVal').textContent = $('darkness').value + '%';
  });

  // ---------- Duration estimate (approximate — real timing depends on the specific unit) ----------
  function estimateSeconds(){
    const rows = ($('printBtn')._rows || []).length;
    if (!rows) return 0;
    const paperWidth = clampInt($('paperWidth').value, 384, 576, 384);
    const bytesPerRow = paperWidth/8;
    const rowCmdBytes = bytesPerRow + 8;
    const totalBytes = rows*rowCmdBytes + 120;
    const speedByte = speedByteFromSlider(clampInt($('speedSlider').value,0,100,50));
    const delayMs = delayMsFromSlider(clampInt($('delaySlider').value,0,100,20));
    const CHUNK = 180;
    const transmitMs = Math.ceil(totalBytes/CHUNK)*delayMs;
    const feedMsPerRow = 8 + speedByte*1.5; // rough — actual motor timing is firmware-controlled
    const physicalMs = rows*feedMsPerRow;
    return Math.max(1, Math.round((transmitMs+physicalMs)/1000));
  }
  function updateDurationEstimate(){
    $('durationEst').textContent = '≈ ' + estimateSeconds() + ' сек';
  }
  ['input','change'].forEach(evt=>{
    $('speedSlider').addEventListener(evt, updateDurationEstimate);
    $('delaySlider').addEventListener(evt, updateDurationEstimate);
  });

  $('advToggle').addEventListener('click', () => {
    $('advPanel').classList.toggle('open');
    $('advToggle').textContent = $('advPanel').classList.contains('open') ? 'настройки принтера ▴' : 'настройки принтера ▾';
  });

  function updateButtons(){
    $('printBtn').disabled = !(writeChar && sourceImage && $('printBtn')._rows);
    $('feedBtn').disabled = !writeChar;
  }

  async function writeChunk(chunk){
    if (writeChar.writeValueWithoutResponse){
      try { await writeChar.writeValueWithoutResponse(chunk); return; } catch(e){ /* fall through */ }
    }
    await writeChar.writeValue(chunk);
  }

  $('feedBtn').addEventListener('click', async () => {
    if (!writeChar) return;
    $('feedBtn').disabled = true;
    try{
      const cmd = new Uint8Array(makeCommand(0xa1, u16le(160)));
      await writeChunk(cmd);
      log('лента протянута — можно оторвать');
    } catch(e){
      log('ошибка протяжки: ' + e.message);
    } finally {
      updateButtons();
    }
  });

  $('stopBtn').addEventListener('click', () => {
    printAbort = true;
    log('остановка…');
  });

  $('printBtn').addEventListener('click', async () => {
    const rows = $('printBtn')._rows;
    if (!rows || !writeChar) return;
    printAbort = false;
    $('printBtn').style.display = 'none';
    $('stopBtn').style.display = 'block';
    $('progressBar').style.width = '0%';
    try{
      const darkness = clampInt($('darkness').value, 0, 100, 55);
      const energy = Math.max(0x1000, Math.round(darkness/100 * 0xffff));
      const speed = speedByteFromSlider(clampInt($('speedSlider').value,0,100,50));
      const delayMs = delayMsFromSlider(clampInt($('delaySlider').value,0,100,20));
      const job = new PrintJob({ energy, speed });
      const data = job.build(rows);
      log('отправка… нагрев=0x' + energy.toString(16) + ' скорость=' + speed + ' пауза=' + delayMs + 'мс');
      const CHUNK = 180;
      let stopped = false;
      for (let i=0; i<data.length; i+=CHUNK){
        if (printAbort){ stopped = true; break; }
        while (paused && !printAbort) await sleep(150);
        if (printAbort){ stopped = true; break; }
        await writeChunk(data.subarray(i, i+CHUNK));
        await sleep(delayMs);
        $('progressBar').style.width = Math.min(100, Math.round((i+CHUNK)/data.length*100)) + '%';
      }
      if (stopped){
        try{
          const stopSeq = new Uint8Array([
            ...makeCommand(0xa6,[0xaa,0x55,0x17,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x17]),
            ...makeCommand(0xa1, u16le(24))
          ]);
          await writeChunk(stopSeq);
        } catch(e){ /* best effort */ }
        log('печать остановлена');
      } else {
        log('готово! ✓');
      }
    } catch(e){
      log('ошибка печати: ' + e.message);
    } finally {
      $('printBtn').style.display = 'block';
      $('stopBtn').style.display = 'none';
      updateButtons();
    }
  });

  function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
})();
</script>
</body>
</html>
